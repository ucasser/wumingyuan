<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>无名园 · 学术文献检索</title>
<style>
:root{--bg:#f8fafc;--s:#fff;--b:#e2e8f0;--t:#0f172a;--m:#64748b;--a:#2563eb;--al:#eff6ff;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:var(--bg);color:var(--t);max-width:900px;margin:0 auto;padding:20px}
h1{font-size:22px;margin-bottom:4px}
.sub{color:var(--m);font-size:13px;margin-bottom:20px}
nav{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--b)}
nav button{padding:10px 20px;border:none;background:none;cursor:pointer;font-size:14px;color:var(--m);border-bottom:2px solid transparent}
nav button.active{color:var(--a);border-bottom-color:var(--a)}
.panel{display:none}
.panel.active{display:block}
.card{background:var(--s);border:1px solid var(--b);border-radius:var(--r);padding:16px;margin-bottom:12px}
input,textarea,select{width:100%;padding:8px 12px;border:1px solid var(--b);border-radius:8px;font-size:14px;margin-bottom:8px}
button.primary{background:var(--a);color:#fff;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;font-size:14px}
button.primary:hover{opacity:.9}
button.danger{background:#ef4444;color:#fff;border:none;padding:8px 20px;border-radius:8px;cursor:pointer;font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.row label{font-size:13px;color:var(--m);min-width:80px}
.progress{background:var(--b);border-radius:8px;height:8px;margin:8px 0}
.progress div{background:var(--a);height:100%;border-radius:8px;transition:width .3s}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px}
.badge.ok{background:#dcfce7;color:#166534}
.badge.err{background:#fee2e2;color:#991b1b}
.result{margin-bottom:12px;padding:12px;background:var(--al);border-radius:8px;font-size:13px}
.result a{color:var(--a);cursor:pointer}
.result .ctx{color:var(--t);margin-top:4px;white-space:pre-wrap;line-height:1.6}
.result .src{color:var(--m);font-size:11px;margin-top:4px}
.chatbox{border:1px solid var(--b);border-radius:var(--r);background:var(--s);height:500px;overflow-y:auto;padding:16px;margin-bottom:8px}
.chatbox .msg{margin-bottom:12px}
.chatbox .user{text-align:right;color:var(--a)}
.chatbox .ai{color:var(--t);line-height:1.7}
.chatbox .ai cite{color:var(--a);font-style:normal;font-size:12px}
.loading{color:var(--m);font-style:italic}
.alert{padding:12px;border-radius:8px;margin-bottom:8px;font-size:13px}
.alert.info{background:#eff6ff;color:#1e40af}
.alert.warn{background:#fef3c7;color:#92400e}
</style>
</head>
<body>
<h1>📚 无名园</h1>
<div class="sub">学术文献检索工具 · 导入 PDF → OCR → 检索 → LLM 回答</div>

<nav>
  <button onclick="showPanel('import')" class="active" id="nav-import">📥 导入</button>
  <button onclick="showPanel('search')" id="nav-search">🔍 检索</button>
  <button onclick="showPanel('chat')" id="nav-chat">💬 问答</button>
  <button onclick="showPanel('settings')" id="nav-settings">⚙ 设置</button>
</nav>

<!-- 导入面板 -->
<div class="panel active" id="panel-import">
  <div class="card">
    <h3>PDF 书籍管理</h3>
    <p style="font-size:13px;color:var(--m);margin-bottom:8px">把 PDF 放入书籍目录后，点击「扫描并导入」</p>
    <div class="row">
      <button class="primary" onclick="startIngest()">扫描并导入</button>
      <button class="danger" onclick="cancelIngest()" style="display:none" id="btn-cancel">停止</button>
    </div>
    <div class="progress" id="ingest-progress" style="display:none"><div style="width:0" id="ingest-bar"></div></div>
    <div id="ingest-msg" style="font-size:12px;color:var(--m)"></div>
  </div>
  <div class="card">
    <h3>已导入文献</h3>
    <div id="file-list" style="font-size:13px;color:var(--m)">点击「扫描并导入」查看…</div>
  </div>
</div>

<!-- 检索面板 -->
<div class="panel" id="panel-search">
  <div class="card">
    <h3>全文搜索</h3>
    <p style="font-size:13px;color:var(--m);margin-bottom:8px">按主题页→全量映射→Top3→原始MD分层检索</p>
    <div class="row">
      <input type="text" id="search-input" placeholder="输入关键词，如：胡绳 传统文化" onkeydown="if(event.key==='Enter')runSearch()">
      <button class="primary" onclick="runSearch()">搜索</button>
    </div>
    <div id="search-loading" class="loading" style="display:none">搜索中…</div>
    <div id="search-results"></div>
  </div>
</div>

<!-- 问答面板 -->
<div class="panel" id="panel-chat">
  <div class="card">
    <h3>AI 问答</h3>
    <p style="font-size:13px;color:var(--m);margin-bottom:8px">自动搜索本地文献，将结果发给大模型，返回带引用的答案。需先在设置中配置 API Key。</p>
    <div class="chatbox" id="chatbox"><div class="loading">配置 API Key 后即可提问…</div></div>
    <div class="row">
      <input type="text" id="chat-input" placeholder="输入你的问题…" onkeydown="if(event.key==='Enter')runChat()">
      <button class="primary" onclick="runChat()">发送</button>
    </div>
    <div id="chat-loading" class="loading" style="display:none">思考中…</div>
  </div>
</div>

<!-- 设置面板 -->
<div class="panel" id="panel-settings">
  <div class="card">
    <h3>大模型 API</h3>
    <div class="row"><label>平台</label>
      <select id="llm-preset" onchange="onPresetChange()">
        <option value="deepseek:deepseek-chat">DeepSeek (deepseek-chat)</option>
        <option value="glm:glm-4-flash">智谱 GLM (glm-4-flash)</option>
        <option value="kimi:moonshot-v1-8k">Kimi 月之暗面 (moonshot-v1-8k)</option>
        <option value="openai:gpt-4o-mini">OpenAI (gpt-4o-mini)</option>
        <option value="custom:">自定义 API</option>
      </select>
    </div>
    <div class="row"><label>API 地址</label><input type="text" id="llm-url" placeholder="https://api.deepseek.com/v1"></div>
    <div class="row"><label>API Key</label><input type="password" id="llm-key" placeholder="sk-…"></div>
    <div class="row"><label>模型名</label><input type="text" id="llm-model" placeholder="deepseek-chat"></div>
    <button class="primary" onclick="saveLlm()">保存</button>
    <span id="llm-status" style="font-size:12px;margin-left:8px"></span>
  </div>
  <div class="card">
    <h3>飞桨 OCR</h3>
    <div class="row"><label>API Token</label><input type="password" id="ocr-token" placeholder="飞桨 OCR Access Token"></div>
    <button class="primary" onclick="saveOcr()">保存</button>
    <button class="primary" onclick="testOcr()" style="margin-left:8px">测试连接</button>
    <span id="ocr-status" style="font-size:12px;margin-left:8px"></span>
  </div>
</div>

<script>
// ── 面板切换 ──
function showPanel(id){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+id).classList.add('active');
  document.getElementById('nav-'+id).classList.add('active');
}

// ── API 预置 ──
const PRESETS={
  'deepseek':{url:'https://api.deepseek.com/v1'},
  'glm':{url:'https://open.bigmodel.cn/api/paas/v4'},
  'kimi':{url:'https://api.moonshot.cn/v1'},
  'openai':{url:'https://api.openai.com/v1'},
};
function onPresetChange(){
  const v=document.getElementById('llm-preset').value;
  const[p,model]=v.split(':');
  if(PRESETS[p]){
    document.getElementById('llm-url').value=PRESETS[p].url;
    if(model) document.getElementById('llm-model').value=model;
  }
}

// ── 导入 ──
let pollTimer=null;
async function startIngest(){
  document.getElementById('ingest-progress').style.display='block';
  document.getElementById('btn-cancel').style.display='inline-block';
  document.getElementById('ingest-msg').innerText='启动中…';
  try{
    await fetch('/api/ingest',{method:'POST'});
    pollIngest();
  }catch(e){
    document.getElementById('ingest-msg').innerText='请求失败';
  }
}
async function cancelIngest(){
  await fetch('/api/ingest/cancel',{method:'POST'});
}
function pollIngest(){
  pollTimer=setInterval(async()=>{
    try{
      const r=await fetch('/api/ingest/status');
      const d=await r.json();
      const bar=document.getElementById('ingest-bar');
      const pct=d.file_count?Math.round(d.current*100/d.file_count):0;
      bar.style.width=pct+'%';
      document.getElementById('ingest-msg').innerText=d.message;
      if(!d.running){
        clearInterval(pollTimer);
        document.getElementById('btn-cancel').style.display='none';
        loadFiles();
      }
    }catch(e){}
  },1000);
}
async function loadFiles(){
  try{
    const r=await fetch('/api/files');
    const d=await r.json();
    const list=d.files.map(f=>`<div class="badge ${f.imported?'ok':'err'}">${f.name} ${f.imported?'✓已导入':'未导入'}</div>`).join(' ');
    document.getElementById('file-list').innerHTML=list||'暂无文件';
  }catch(e){}
}
loadFiles();

// ── 搜索 ──
async function runSearch(){
  const q=document.getElementById('search-input').value.trim();
  if(!q) return;
  document.getElementById('search-loading').style.display='block';
  document.getElementById('search-results').innerHTML='';
  try{
    const r=await fetch('/api/agent/search',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({q,top_k:20})
    });
    const d=await r.json();
    document.getElementById('search-loading').style.display='none';
    if(!d.results||!d.results.length){
      document.getElementById('search-results').innerHTML='<div class="alert info">未找到相关材料</div>';
      return;
    }
    let html=`<div style="font-size:12px;color:var(--m);margin-bottom:8px">找到 ${d.count} 条结果</div>`;
    d.results.forEach(r=>{
      html+=`<div class="result">
        <strong>${r.name||r.rel_path}</strong>
        <div class="src">${r.rel_path||r.file}</div>`;
      (r.snippets||[]).forEach(s=>{
        html+=`<div class="ctx">${s.text||''}</div>`;
      });
      html+='</div>';
    });
    document.getElementById('search-results').innerHTML=html;
  }catch(e){
    document.getElementById('search-loading').style.display='none';
    document.getElementById('search-results').innerHTML=`<div class="alert warn">搜索失败: ${e}</div>`;
  }
}

// ── 问答 ──
async function runChat(){
  const q=document.getElementById('chat-input').value.trim();
  if(!q) return;
  const box=document.getElementById('chatbox');
  box.innerHTML+=`<div class="msg user"><strong>你：</strong>${q}</div>`;
  document.getElementById('chat-input').value='';
  box.innerHTML+='<div class="msg ai" id="ai-msg"><div class="loading">搜索中…</div></div>';
  box.scrollTop=box.scrollHeight;
  const ai=document.getElementById('ai-msg');

  try{
    const r=await fetch('/api/agent/chat/stream',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({q,history:[]})
    });
    const reader=r.body.getReader();
    const decoder=new TextDecoder();
    let buf='';
    ai.innerHTML='';
    while(true){
      const{value,done}=await reader.read();
      if(done) break;
      buf+=decoder.decode(value,{stream:true});
      const lines=buf.split('\n');
      buf=lines.pop();
      for(const line of lines){
        if(line.startsWith('data: ')){
          const data=line.slice(6);
          if(data==='[DONE]') continue;
          try{
            const chunk=JSON.parse(data);
            if(chunk.error){ai.innerHTML=`<div class="alert warn">${chunk.error}</div>`;return}
            if(chunk.content) ai.innerHTML+=chunk.content.replace(/\[(\d+)\]/g,'<cite>[$1]</cite>');
          }catch(e){}
        }
      }
      box.scrollTop=box.scrollHeight;
    }
  }catch(e){
    ai.innerHTML=`<div class="alert warn">请求失败: ${e.message}。请检查 API Key 设置。</div>`;
  }
}

// ── 设置 ──
async function loadSettings(){
  try{
    const r=await fetch('/api/settings');
    const d=await r.json();
    const llm=d.llm||{};
    if(llm.api_key) document.getElementById('llm-key').value=llm.api_key;
    if(llm.base_url) document.getElementById('llm-url').value=llm.base_url;
    if(llm.model) document.getElementById('llm-model').value=llm.model;
    const ocr=d.ocr||{};
    const paddle=ocr.paddle||{};
    if(paddle.api_token) document.getElementById('ocr-token').value=paddle.api_token;
  }catch(e){}
}
loadSettings();

async function saveLlm(){
  const body={llm:{
    base_url:document.getElementById('llm-url').value.trim(),
    api_key:document.getElementById('llm-key').value.trim(),
    model:document.getElementById('llm-model').value.trim(),
    timeout:60
  }};
  try{
    await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    document.getElementById('llm-status').innerText='✓ 已保存';
  }catch(e){
    document.getElementById('llm-status').innerText='保存失败';
  }
}

async function saveOcr(){
  const body={ocr:{paddle:{api_token:document.getElementById('ocr-token').value.trim()}}};
  try{
    await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    document.getElementById('ocr-status').innerText='✓ 已保存';
  }catch(e){
    document.getElementById('ocr-status').innerText='保存失败';
  }
}

async function testOcr(){
  document.getElementById('ocr-status').innerText='测试中…';
  try{
    const r=await fetch('/api/ocr/test',{method:'POST'});
    const d=await r.json();
    document.getElementById('ocr-status').innerText=d.ok?'✓ 连接成功':'✗ '+d.error;
  }catch(e){
    document.getElementById('ocr-status').innerText='✗ 连接失败';
  }
}
</script>
</body>
</html>
